<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espacio Fitness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl text-center">
    <h1 class="text-3xl font-extrabold text-red-600 mb-2 tracking-wider">ESPACIO FITNESS</h1>
    <p class="text-zinc-400 text-sm mb-6">Sistema de Reservas y Gestión</p>

    <!-- FORMULARIO DE INGRESO -->
    <div id="login-section" class="space-y-4">
      <input type="text" id="socio-id" placeholder="Ingresá tu DNI o Código (ej: 123456)" 
             class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-600 transition">
      
      <button onclick="buscarSocio()" 
              class="w-full bg-red-600 hover:bg-red-700 font-bold py-3 rounded-xl transition shadow-lg shadow-red-900/40">
        Ingresar
      </button>
      <p id="mensaje" class="text-sm font-semibold mt-2 text-zinc-400"></p>
    </div>

    <!-- PANEL DEL SOCIO -->
    <div id="socio-panel" class="hidden text-left mt-4 border-t border-zinc-800 pt-4 space-y-4">
      <h2 id="socio-nombre" class="text-xl font-bold text-white"></h2>
      
      <!-- TARJETA DE PLAN Y CRÉDITOS -->
      <div class="bg-zinc-800/60 p-4 rounded-xl border border-zinc-700/50">
        <p class="text-xs text-zinc-400">Plan Actual</p>
        <p id="socio-plan" class="font-semibold text-red-500">-</p>
        
        <div class="flex justify-between items-center mt-3">
          <div>
            <p class="text-xs text-zinc-400">Créditos Disponibles</p>
            <p id="socio-creditos" class="text-2xl font-black text-white">-</p>
          </div>
          <div class="text-right">
            <p class="text-xs text-zinc-400">Vencimiento</p>
            <p id="socio-vencimiento" class="text-sm font-medium text-zinc-300">-</p>
          </div>
        </div>
      </div>

      <!-- SECCIÓN DE RESERVAS -->
      <div class="bg-zinc-950/50 p-4 rounded-xl border border-zinc-800 space-y-3">
        <h3 class="text-sm font-bold text-zinc-300 uppercase tracking-wider">Reservar Clase</h3>
        
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Seleccionar Fecha</label>
          <input type="date" id="reserva-fecha" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-600">
        </div>

        <div>
          <label class="text-xs text-zinc-400 block mb-1">Seleccionar Turno</label>
          <select id="reserva-turno" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-600">
            <option value="08:00 Hs">08:00 Hs - Mañana</option>
            <option value="10:00 Hs">10:00 Hs - Mañana</option>
            <option value="18:00 Hs">18:00 Hs - Tarde</option>
            <option value="19:00 Hs">19:00 Hs - Tarde</option>
            <option value="20:00 Hs">20:00 Hs - Noche</option>
          </select>
        </div>

        <button onclick="confirmarReserva()" id="btn-reservar" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-red-900/30">
          Confirmar Reserva
        </button>
        <p id="reserva-mensaje" class="text-xs text-center font-semibold mt-1"></p>
      </div>
      
      <button onclick="location.reload()" class="w-full bg-transparent text-zinc-500 text-xs py-1 hover:text-zinc-300">
        Salir / Volver
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hhjpvoqmycsbxrnjosuu.supabase.co';
    const SUPABASE_KEY = 'TU_CLAVE_PUBLISHABLE_AQUI'; // <--- Mantené tu clave acá

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let socioActual = null;
    let pagoActual = null;

    // Configurar la fecha por defecto a HOY
    document.getElementById('reserva-fecha').valueAsDate = new Date();

    async function buscarSocio() {
      const socioId = document.getElementById('socio-id').value.trim();
      const msg = document.getElementById('mensaje');
      
      if (!socioId) {
        msg.textContent = 'Por favor ingresá un ID válido.';
        msg.className = 'text-sm font-semibold mt-2 text-red-500';
        return;
      }

      msg.textContent = 'Buscando socio...';
      msg.className = 'text-sm font-semibold mt-2 text-zinc-400';

      try {
        const { data: socio, error: errSocio } = await _supabase
          .from('socios')
          .select('*')
          .eq('id', socioId)
          .maybeSingle();

        if (errSocio || !socio) {
          msg.textContent = 'Socio no encontrado. Revisa el ID.';
          msg.className = 'text-sm font-semibold mt-2 text-red-500';
          return;
        }

        const { data: pagos } = await _supabase
          .from('pagos_creditos')
          .select('*')
          .eq('socio_id', socioId);

        socioActual = socio;
        document.getElementById('socio-nombre').textContent = `${socio.nombre} ${socio.apellido}`;
        
        if (pagos && pagos.length > 0) {
          pagoActual = pagos[0];
          document.getElementById('socio-plan').textContent = pagoActual.plan;
          document.getElementById('socio-creditos').textContent = pagoActual.creditos_disponibles;
          document.getElementById('socio-vencimiento').textContent = pagoActual.fecha_vencimiento;
        } else {
          pagoActual = null;
          document.getElementById('socio-plan').textContent = 'Sin plan activo';
          document.getElementById('socio-creditos').textContent = '0';
          document.getElementById('socio-vencimiento').textContent = 'N/A';
        }

        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('socio-panel').classList.remove('hidden');

      } catch (err) {
        console.error(err);
        msg.textContent = 'Error al conectar con la base de datos.';
        msg.className = 'text-sm font-semibold mt-2 text-red-500';
      }
    }

    async function confirmarReserva() {
      const msg = document.getElementById('reserva-mensaje');
      const btn = document.getElementById('btn-reservar');
      const fecha = document.getElementById('reserva-fecha').value;
      const turno = document.getElementById('reserva-turno').value;

      if (!pagoActual || pagoActual.creditos_disponibles <= 0) {
        msg.textContent = '❌ No tenés créditos suficientes para reservar.';
        msg.className = 'text-xs text-center font-semibold mt-1 text-red-500';
        return;
      }

      btn.disabled = true;
      msg.textContent = 'Procesando reserva...';
      msg.className = 'text-xs text-center font-semibold mt-1 text-zinc-400';

      try {
        // 1. Guardar la reserva en la tabla 'reservas'
        const { error: errReserva } = await _supabase
          .from('reservas')
          .insert([{ socio_id: socioActual.id, fecha: fecha, turno: turno }]);

        if (errReserva) {
          if (errReserva.code === '23505') {
            msg.textContent = '⚠️ Ya tenés una reserva para este turno y fecha.';
          } else {
            msg.textContent = '❌ Error al registrar reserva.';
          }
          msg.className = 'text-xs text-center font-semibold mt-1 text-amber-500';
          btn.disabled = false;
          return;
        }

        // 2. Descontar 1 crédito en 'pagos_creditos'
        const nuevosCreditos = pagoActual.creditos_disponibles - 1;
        
        await _supabase
          .from('pagos_creditos')
          .update({ creditos_disponibles: nuevosCreditos })
          .eq('id', pagoActual.id);

        // Actualizar interfaz
        pagoActual.creditos_disponibles = nuevosCreditos;
        document.getElementById('socio-creditos').textContent = nuevosCreditos;

        msg.textContent = '✅ ¡Reserva realizada con éxito!';
        msg.className = 'text-xs text-center font-semibold mt-1 text-emerald-400';

      } catch (err) {
        console.error(err);
        msg.textContent = '❌ Ocurrió un problema de conexión.';
        msg.className = 'text-xs text-center font-semibold mt-1 text-red-500';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
